# 游戏资源包自动同步：上游 ArknightsGameResource 一更新，这里就重新生成
#
# 触发时间（北京时间）：每天 12:00 和 16:00 —— 明日方舟版本更新主要集中在这两个点
# 对应 UTC 的 04:00 / 08:00。另外支持手动触发。
#
# 做的事（tools/sync_pack.py）：
#   1. 取上游 main 的 commit sha，和 resources/arknights.json 里的 sourceCommit 比
#      一样就结束（不下载、不提交，所以平时这条流水线几乎没有输出）
#   2. 按 sha 定点下载 gamedata/excel 下 9 个 json（上游仓库 7 GB，绝不 clone）
#   3. 重新生成 resources/arknights.json 和 resources/paradox.json
#   4. 条数只增不减才放行；生成 pack-manifest.json 给客户端比对
#   5. 直接把产物提交回 main（数据不是代码，不走 PR），带 [skip ci] 不触发其他流程
#
# 注意：scheduled workflow 在仓库连续 60 天没有提交时会被 GitHub 自动停掉，
#       停掉后到 Actions 页面点一次 "Enable workflow" 即可。
name: Pack Sync

on:
  schedule:
    - cron: '0 4,8 * * *'   # 12:00 / 16:00（UTC+8）
  workflow_dispatch:
    inputs:
      force:
        description: '上游没更新也强制重新生成'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pack-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 同步上游资源
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 只用标准库，不需要装依赖
      - name: Sync pack from upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -u tools/sync_pack.py --force
          else
            python -u tools/sync_pack.py
          fi

      - name: Validate pack
        run: |
          python - <<'PY'
          import json
          pack = json.load(open('resources/arknights.json', encoding='utf-8'))
          para = json.load(open('resources/paradox.json', encoding='utf-8'))
          man = json.load(open('resources/pack-manifest.json', encoding='utf-8'))
          counts = pack.get('counts') or {}
          assert counts.get('chars', 0) > 0, '干员表为空'
          assert counts.get('stages', 0) > 0, '关卡表为空'
          assert para.get('count', 0) > 0, '悖论清单为空'
          assert pack.get('fingerprint'), '资源包没有指纹'
          assert set(man.get('packs') or {}) == {'arknights', 'paradox'}, 'manifest 不完整'
          for k in ('arknights', 'paradox'):
              assert man['packs'][k].get('sha256'), '%s 缺 sha256' % k
          print('版本 %s ｜ 指纹 %s ｜ 干员 %d ｜ 关卡 %d ｜ 悖论 %d' % (
              pack.get('version'), pack.get('fingerprint'),
              counts['chars'], counts['stages'], para['count']))
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          set -e
          FILES="resources/arknights.json resources/paradox.json resources/pack-manifest.json"
          git add $FILES
          if git diff --cached --quiet; then
            echo "上游没有新内容，本次不提交"
            echo "### 上游无更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION=$(python -c "import json;print(json.load(open('resources/arknights.json',encoding='utf-8'))['version'])")
          FP=$(python -c "import json;print(json.load(open('resources/arknights.json',encoding='utf-8'))['fingerprint'])")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(pack): 同步游戏资源 ${VERSION} [skip ci]" \
                     -m "上游提交 $(python -c "import json;print(json.load(open('resources/pack-manifest.json',encoding='utf-8'))['source']['commit'][:12])")" \
                     -m "指纹 ${FP}"
          git push origin HEAD:main
          echo "### 资源已更新到 ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "指纹 \`${FP}\`" >> "$GITHUB_STEP_SUMMARY"

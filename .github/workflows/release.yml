# 发版 CI：合并提交落到 release 分支的那一刻触发（即 release 分支多了提交）
#
# 工作流（只做 Windows 平台）：
#   1. 要发版时：从 release 分支拉新分支，把 backend/core/version.py 的
#      APP_VERSION 改成新版本号（其它改动照常），PR 用 merge commit 合回
#      release 分支
#   2. 合并产生的提交推到 release 时本工作流自动触发：冒烟测试 → 打包 →
#      压缩 build/MAA-PRTS 为 MAA-PRTS-vX.Y.Z-win-<架构>.zip →
#      changelog 取上一个 tag 以来的全部 commits → 直接发布 Release，
#      tag 打在这次合并提交上
#   3. 版本号以 APP_VERSION 为准；若该版本的 tag 已存在（比如合并了没改
#      版本号的 PR），本次推送跳过发版，避免覆盖已发布的 Release。
#      要重发同一版本：先删掉对应 Release 与 tag，再重新触发
name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

# 连续合并不互相取消，按顺序逐个发版
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: 读取版本号并检查是否已发过
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 要能看到已有 tag
          show-progress: false

      - name: Read APP_VERSION and check tag
        id: version
        shell: bash
        run: |
          ver=$(sed -n "s/^APP_VERSION = '\([0-9][0-9.]*\)'.*/\1/p" backend/core/version.py | head -n1)
          if [ -z "$ver" ]; then
            echo "::error::无法从 backend/core/version.py 读出 APP_VERSION（应为 X.Y.Z 形式）"
            exit 1
          fi
          version="v$ver"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null 2>&1; then
            echo "::notice::$version 已发布过（tag 已存在），本次推送跳过发版"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: 构建并发布（Windows）
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog 需要完整历史与 tag
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary pywebview pythonnet pyinstaller pillow

      - name: Run smoke test
        run: python -u tools/smoketest/smoke_test.py

      - name: Build
        run: python -u build.py

      - name: Package zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/MAA-PRTS/MAA-PRTS.exe')) { throw 'build/MAA-PRTS/MAA-PRTS.exe 不存在' }
          Copy-Item tools/release/README.txt build/MAA-PRTS/
          $map = @{ 'AMD64' = 'x64'; 'ARM64' = 'arm64'; 'x86' = 'x86' }
          $arch = $map[$env:PROCESSOR_ARCHITECTURE]
          if (-not $arch) { $arch = $env:PROCESSOR_ARCHITECTURE.ToLower() }
          # 压缩包内保留顶层 MAA-PRTS 文件夹（与历史发布包一致），解压即得完整目录
          $zip = "MAA-PRTS-$env:VERSION-win-$arch.zip"
          Compress-Archive -Path 'build/MAA-PRTS' -DestinationPath $zip
          "ZIP=$zip" | Add-Content $env:GITHUB_ENV
          Get-Item $zip | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Generate changelog from commits
        shell: bash
        run: |
          {
            echo "## 更新内容"
            echo
            last=$(git describe --tags --match 'v*' --abbrev=0 --exclude="$VERSION" HEAD 2>/dev/null || true)
            if [ -n "$last" ]; then
              git log --no-merges --pretty=format:'- %h %s' "$last..HEAD"
              echo
              echo
              echo "**Full Changelog**: [$last → $VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$last...$VERSION)"
            else
              git log --no-merges --pretty=format:'- %h %s'
            fi
            # 与历史发布包一致，附压缩包校验值
            echo
            echo "## 校验"
            echo
            echo '```'
            echo "SHA256 ($ZIP) = $(sha256sum "$ZIP" | cut -d' ' -f1)"
            echo '```'
          } > CHANGELOG.md
          cat CHANGELOG.md

      # 合并提交已经落在 release 分支上，直接发布；tag 打在该提交上
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: ${{ env.ZIP }}

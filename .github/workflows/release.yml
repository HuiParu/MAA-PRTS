# 发版 CI：标题形如「Release vX.Y.Z」的 PR 触发
#
# 流程（只做 Windows 平台）：
#   1. PR 打开 / 有新提交时：在该 PR 的代码上跑冒烟测试 + 打包，
#      产物压缩为 MAA-PRTS-vX.Y.Z-win-<架构>.zip，连同 commits 生成的
#      changelog 一起挂到同名【草稿】Release 上（每次新提交会刷新草稿）。
#   2. PR 合并时：在合并提交上重新构建一遍，然后把草稿 Release 正式发布
#      （tag 打在合并提交上）。PR 被关闭而未合并则什么都不做，残留草稿可手动删。
#
# 版本号取自 PR 标题；构建前会把 backend/core/version.py 的 APP_VERSION
# 改成该版本（只改 CI 检出副本，不提交），忘改版本号也不会发错版。
name: Release

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: write

# 同一个 Release PR 只保留最新一次构建；合并触发的构建会取消还在跑的旧构建
concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包（Windows）
    # 只认本仓库分支发起、非草稿、标题以 Release v 开头的 PR；
    # PR 被关闭且未合并时不构建（由 publish / 手动处理）
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      startsWith(github.event.pull_request.title, 'Release v') &&
      !(github.event.action == 'closed' && !github.event.pull_request.merged)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      # 合并事件检出合并提交（tag 要打在这里），其余事件检出 PR 头部提交
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event.action == 'closed' && github.event.pull_request.merge_commit_sha) || github.event.pull_request.head.sha }}
          # 拉全量历史是为了用 git describe 找上一个 tag 生成 changelog
          fetch-depth: 0
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary pywebview pythonnet pyinstaller pillow

      - name: Extract version from PR title
        id: version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version=$(printf '%s' "$PR_TITLE" | grep -oE '^Release v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^Release //')
          if [ -z "$version" ]; then
            echo "::error::无法从 PR 标题解析版本号：$PR_TITLE（应为「Release vX.Y.Z」）"
            exit 1
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run smoke test
        run: python -u tools/smoketest/smoke_test.py

      - name: Patch APP_VERSION to release version
        shell: python
        run: |
          import io, os, re
          version = os.environ['VERSION'].lstrip('v')
          path = 'backend/core/version.py'
          src = io.open(path, encoding='utf-8').read()
          new, n = re.subn(r"APP_VERSION = '[^']*'", "APP_VERSION = '%s'" % version, src, count=1)
          if n != 1:
              raise SystemExit('未能在 %s 中找到 APP_VERSION' % path)
          io.open(path, 'w', encoding='utf-8', newline='').write(new)
          print('APP_VERSION -> %s' % version)

      - name: Build
        run: python -u build.py

      - name: Package zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/MAA-PRTS/MAA-PRTS.exe')) { throw 'build/MAA-PRTS/MAA-PRTS.exe 不存在' }
          Copy-Item tools/release/README.txt build/MAA-PRTS/
          $map = @{ 'AMD64' = 'x64'; 'ARM64' = 'arm64'; 'x86' = 'x86' }
          $arch = $map[$env:PROCESSOR_ARCHITECTURE]
          if (-not $arch) { $arch = $env:PROCESSOR_ARCHITECTURE.ToLower() }
          # 压缩包内保留顶层 MAA-PRTS 文件夹（与历史发布包一致），解压即得完整目录
          $zip = "MAA-PRTS-$env:VERSION-win-$arch.zip"
          Compress-Archive -Path 'build/MAA-PRTS' -DestinationPath $zip
          "ZIP=$zip" | Add-Content $env:GITHUB_ENV
          Get-Item $zip | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Generate changelog from commits
        shell: bash
        run: |
          {
            echo "## 更新内容"
            echo
            last=$(git describe --tags --match 'v*' --abbrev=0 --exclude="$VERSION" HEAD 2>/dev/null || true)
            if [ -n "$last" ]; then
              git log --no-merges --pretty=format:'- %h %s' "$last..HEAD"
              echo
              echo
              echo "**Full Changelog**: [$last → $VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$last...$VERSION)"
            else
              git log --no-merges --pretty=format:'- %h %s'
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      # 草稿对使用者不可见，可反复刷新；发布在 PR 合并后由 publish 进行
      - name: Create / update draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ (github.event.action == 'closed' && github.event.pull_request.merge_commit_sha) || github.event.pull_request.head.sha }}
          body_path: CHANGELOG.md
          files: ${{ env.ZIP }}

  publish:
    name: 合并后正式发布
    needs: build
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
